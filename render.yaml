# Render blueprint: the API, three cron jobs that keep prices fresh, and the
# Postgres database they share. Sign-in is with Google, run by the API (src/auth/google.ts).
# Secrets (sync: false) are filled in the Render dashboard, not here.
# Loading the data and copying your tastings: docs/DEPLOY.md.

databases:
  - name: winetracker-db
    plan: 0.1c-256mb   # 0.1 CPU, 256 MB RAM ("Basic-256mb")
    diskSizeGB: 5
    postgresMajorVersion: "16"
    databaseName: winetracker
    user: winetracker
    region: oregon
    ipAllowList:
      # Needed to load the data from your computer; narrow it to your IP (or remove it) afterwards.
      - source: 0.0.0.0/0
        description: anywhere (password required)

services:
  - type: web
    name: winetracker-api
    runtime: node
    plan: 0.5c-512mb   # "Starter"
    region: oregon
    # tsx (which runs the TypeScript) is a dev dependency; NODE_ENV=production would skip it.
    buildCommand: npm ci --include=dev
    startCommand: npm start   # applies pending migrations first
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Price refreshes re-check known shop pages only (no paid web search).
      - key: PRICE_WEB_SEARCH
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: winetracker-db
          property: connectionString
      - key: TRUST_PROXY
        value: "1"
      # Label reading. Falls back to OpenRouter while GEMINI_API_KEY is unset.
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      # Also reads flavors from tasting notes the phone can't (free models), whatever LLM_PROVIDER says.
      - key: OPENROUTER_API_KEY
        sync: false
      # Jev (decision model through OpenRouter, src/llm/jev.ts), a prototype: which uses are on, comma
      # separated - match (settle uncertain wine-list matches), flavors (tasting notes), predict. Off when empty.
      - key: JEV_FEATURES
        value: ""
      # Google sign-in: an OAuth "Web application" client with the redirect URI
      # https://<this service>.onrender.com/api/auth/google/callback (docs/DEPLOY.md).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Signs session tokens. Changing it signs everyone out.
      - key: AUTH_SESSION_SECRET
        generateValue: true
      # "exp" lets Expo Go receive the sign-in; drop it once you only use App Store/TestFlight builds.
      - key: AUTH_APP_SCHEMES
        value: winetracker,exp
      - key: ALLOWED_ORIGINS
        sync: false

  # Price updates (src/worker.ts jobs), each run once and exit. Render never starts a
  # cron job while its previous run is still going.
  - type: cron
    name: winetracker-feeds   # Shopify/WooCommerce shop catalogs, daily
    runtime: node
    plan: 0.5c-512mb   # "Starter"
    region: oregon
    schedule: "17 9 * * *"
    buildCommand: npm ci --include=dev
    startCommand: npm run worker -- --once feeds
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Price refreshes re-check known shop pages only (no paid web search).
      - key: PRICE_WEB_SEARCH
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: winetracker-db
          property: connectionString

  - type: cron
    name: winetracker-pages   # sitemap shops (Wally's), up to 2,000 product pages per run, every 6 h
    runtime: node
    plan: 0.5c-512mb   # "Starter"
    region: oregon
    schedule: "47 */6 * * *"
    buildCommand: npm ci --include=dev
    startCommand: npm run worker -- --once pages
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Price refreshes re-check known shop pages only (no paid web search).
      - key: PRICE_WEB_SEARCH
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: winetracker-db
          property: connectionString

  - type: cron
    name: winetracker-watched   # wines people saved or tasted lately, stalest first, daily
    runtime: node
    plan: 0.5c-512mb   # "Starter"
    region: oregon
    schedule: "23 11 * * *"
    buildCommand: npm ci --include=dev
    startCommand: npm run worker -- --once watched
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Price refreshes re-check known shop pages only (no paid web search).
      - key: PRICE_WEB_SEARCH
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: winetracker-db
          property: connectionString
